name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1
  provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1
  links:
    uses: OregonAI/corpus-toolkit/.github/workflows/check-links.yml@v1
    with:
      # lychee walks './**/*.md'. Without these exclusions it crawls
      # _meta/templates/document.md — a skeleton whose example URLs are not meant
      # to resolve — and every PR fails on link rot that is not link rot.
      # _meta/snapshots/ is excluded because a large corpus's snapshots would drag
      # hundreds of upstream URLs into a per-PR gate; upstream availability is what
      # the scheduled drift job is for.
      # `reports/` is excluded because its links are NOT this repository's links.
      #
      # Every document's `## Full text` is verbatim government text, and audit reports cite
      # URLs constantly. Measured on the first full run: 781 links checked, 150 errors, all
      # of them inside reports/. A 2020 audit citing a page that died in 2022 is an ACCURATE
      # COPY of a 2020 document, not link rot in this corpus -- and "fixing" one would mean
      # editing quoted text, which AGENTS.md forbids outright.
      #
      # Several failures are the division's own /audits/Documents/<no>.pdf links, which is
      # the same URL rot that put the pre-2020 reports out of reach. The corpus is right and
      # the upstream link is dead; a red check here would be blaming the wrong party.
      #
      # THE LINKS THAT ARE OURS ARE STILL CHECKED, just not here. Every document's
      # frontmatter `source_url` is fetched weekly by the `drift` job
      # (corpus-detect-changes), which exits non-zero on any fetch failure. Verified at
      # ingest: 0 of our 242 source_urls appear among the 150 failures.
      exclude-paths: |
        _meta/snapshots
        _meta/templates
        reports

  # The gates every template-shaped corpus owes -- authority graph current, STATUS.md current,
  # llms.txt Contents filled in -- run from the toolkit's reusable template-gates.yml, so they
  # cannot drop out of this file one at a time (corpus-toolkit v1.35.0; CONTEXT.md "Template
  # gates"). Corpus-specific checks stay in `generated` below.
  template-gates:
    uses: OregonAI/corpus-toolkit/.github/workflows/template-gates.yml@v1

  # EVERY COMMITTED GENERATED ARTIFACT MUST BE CURRENT, checked on every PR.
  #
  # This is the gate the toolkit cannot provide for you. It only READS
  # _meta/graph.json, so nothing upstream notices when a document is added and the
  # graph is not rebuilt — resolve_citation and graph_neighbors simply stop finding
  # it, silently, with no error anywhere.
  #
  # What this corpus commits, and what covers it:
  #
  #   _meta/graph.json   src/build_graph.py         this job, every PR
  #   STATUS.md          corpus-generate-status     this job, every PR
  #
  # STATUS.md is also regenerated and committed by the weekly `drift` job in
  # scheduled.yml. That is a repair, not a gate: between Mondays a PR can merge a
  # document and leave the published status wrong for six days with nothing saying so.
  #
  # _meta/corpus-index.json is deliberately ABSENT from this list. The platform builds
  # it at deploy time in publish-index.yml and never commits it, precisely so it cannot
  # fall behind its own corpus in a way that damages a SIBLING repo's citation
  # resolution. Do not commit one and then gate it here; publish it instead.
  #
  # ADD A STEP HERE FOR EVERY GENERATED FILE YOU COMMIT. A generated file with no step
  # is the failure this whole job exists to prevent, and it is silent by construction.
  #
  # Note the checks are `--check` rather than `git diff --exit-code`: STATUS.md carries
  # a "Generated <date>" line, so a raw diff would fail every day for a reason that is
  # not drift. Both `--check` implementations compare CONTENT and print the exact
  # command to re-run.
  generated:
    # Waits for template-gates and fails when it failed, so the template gates are binding
    # through this (required) check until `template-gates / gates` is itself required.
    needs: template-gates
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: template-gates must have passed
        if: needs.template-gates.result != 'success'
        run: |
          echo "template-gates finished with '${{ needs.template-gates.result }}' -- see that job" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Install the toolkit at the SERVING pin -- the one requirements.txt names and the
      # Dockerfile bakes -- so these gates prove the toolkit this corpus actually ships. The
      # reusable workflows above run the CI track at `@v1` (corpus-toolkit ADR-0014).
      - run: pip install -r requirements.txt
      # PER-PR, unlike the manifest check. These derive purely from committed content --
      # no network, deterministic -- and a PR is exactly the thing that can violate them.
      # Eight failure modes, each verified to fire before this was wired: a missing period
      # key, an empty period text, a response field that contradicts the body in either
      # direction, an invalid response value, free prose in At a glance, a fabricated
      # quotation, and an empty corpus.
      - name: Finding-is-not-a-fact guardrails
        run: python3 src/check_guardrails.py
      # Committed-data only, like the KPM original: every audited_agency is classified
      # (mapped or unmapped-with-reason) and every mapped document carries the registry
      # stamp. Referential integrity against ERF itself is --verify-registry, run in
      # review, because CI here must not depend on a sibling checkout.
      - name: Agency crosswalk must account for every audited_agency
        run: python3 src/link_agency_registry.py --check
      # The cross-corpus contract file. src/federal_ids.py is a verbatim copy of the
      # canonical one in federal-reference — both sides must compute the same ids BY
      # CONSTRUCTION, and a drifted copy diverges silently while every local check stays
      # green (federal-reference#11; the failure class is pl-113-128-wioa, unreachable
      # from every sibling with nothing failing). diff, not a hash compare, so the drift
      # itself appears in the log. This is the one deliberate exception to "CI must not
      # need the network": the parity being checked IS a cross-repo fact, and curl -sSf
      # makes a fetch failure a loud failure rather than a silent pass.
      - name: federal_ids.py must match the canonical copy in federal-reference
        run: |
          curl -sSf --retry 3 -o /tmp/canonical_federal_ids.py \
            https://raw.githubusercontent.com/OregonAI/federal-reference/main/src/federal_ids.py
          diff -u /tmp/canonical_federal_ids.py src/federal_ids.py
      # The committed audit-mix page derives purely from reports/ frontmatter; a PR
      # that adds a report without rebuilding it would silently serve a stale chart.
      - name: Audit-mix chart must be current
        run: python3 src/build_audit_mix.py --check
