name: scheduled
on:
  schedule:
    # WEEKLY for the cheap local checks and the manifest, ANNUAL for re-fetching sources.
    # The split matters here more than in most corpora -- see the drift job.
    - cron: "0 14 * * 1"        # Mondays: full validation + is the manifest complete
    - cron: "0 15 15 1 *"       # 15 January: re-fetch every source (drift)
  workflow_dispatch:

jobs:
  # RE-FETCHING EVERY SOURCE, ANNUALLY, AND NOT WEEKLY.
  #
  # AN AUDIT REPORT DOES NOT CHANGE AFTER IT IS PUBLISHED. It is a dated historical record:
  # Report No. 2021-18 says in 2030 exactly what it said in 2021. So content-drift detection
  # -- the entire purpose of this job in every other corpus -- detects something that cannot
  # happen here, and it is not cheap: 242 sources at ~6 MB of ORMS viewer HTML each is
  # ~1.4 GB pulled off a government web server, weekly, for nothing.
  #
  # It is not deleted, because ONE thing it catches is real: a record MOVING or being
  # withdrawn, which this publisher demonstrably does -- every pre-2020 report has already
  # vanished from its old path. When that happens the fix is to update source_url so the
  # citation still resolves, and a fetch failure is how we would learn. Annually is enough
  # for that; weekly is just noise on someone else's server.
  #
  # Read its output accordingly: FETCH FAILED is the signal, CHANGED is not. A CHANGED here
  # means the ORMS viewer page was redesigned, not that an audit finding was revised.
  #
  # WHAT ACTUALLY CHANGES WEEKLY IS THE CATALOGUE, not the documents -- the division
  # publishes new reports. That is the `manifest-complete` job below, which is one small
  # SharePoint query rather than 1.4 GB.
  drift:
    if: github.event.schedule != '0 14 * * 1'
    permissions:
      contents: write
      issues: write
    uses: OregonAI/corpus-toolkit/.github/workflows/detect-upstream-changes.yml@v1.19.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.19.0

  # FULL-CORPUS validation. ci.yml only ever validates files CHANGED in a PR,
  # which leaves two real holes:
  #
  #   1. A document merged before a rule tightened is never re-checked, and a
  #      document whose snapshot is later deleted is never re-detected.
  #   2. On a repository's FIRST push to main, github.event.before is all-zeros,
  #      so the changed-file set is empty and validation passes having checked
  #      nothing. An initial bulk import can land fully green and completely
  #      unvalidated — the single worst moment to not be looking.
  #
  # The toolkit's reusable workflows already branch on github.event_name and run
  # the full corpus for schedule/workflow_dispatch; without these two jobs that
  # branch is dead code in every corpus built from this template.
  full-frontmatter:
    uses: OregonAI/corpus-toolkit/.github/workflows/validate-frontmatter.yml@v1.19.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.19.0
  full-provenance:
    uses: OregonAI/corpus-toolkit/.github/workflows/verify-provenance.yml@v1.19.0
    with:
      # Pin the CODE, not just the workflow file above — separate knobs.
      toolkit-ref: v1.19.0

  # IS THE SOURCE MANIFEST STILL COMPLETE?
  #
  # Deliberately HERE and not in ci.yml's `generated` job, which is where every other
  # generated file is checked. The distinction is what the artifact derives from:
  #
  #   graph.json, STATUS.md   derive from REPO CONTENT. Deterministic, offline, and a PR
  #                           is exactly the thing that can invalidate them. Per-PR.
  #   source-manifest.yml     derives from UPSTREAM. The Audits Division publishes on its
  #                           own schedule, so this file goes stale for reasons no PR
  #                           caused and no PR can fix.
  #
  # Checking it per-PR would fail unrelated PRs whenever the division published an audit,
  # and would put a network call on the critical path of every merge. Both train an
  # operator to ignore a red check, which costs more than the case it catches.
  manifest-complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      # Non-zero here means one of two things, and the output says which: the manifest is
      # stale (a new audit was published), or enumeration itself is incomplete because a
      # report on recent.aspx is missing from the SharePoint list.
      - name: Source manifest must still match upstream
        run: python3 src/enumerate_audits.py --check
