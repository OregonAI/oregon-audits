unmapped:
  'Multi-Agency':
    reason: Names no single organization. A report spanning agencies cannot be attributed to one
      registry entry without inventing an identity the report does not state. The per-report ORS/OAR
      citation edges still resolve each report to the specific rules and statutes it examined.
  'Government Accountability Hotline':
    reason: A program of the Audits Division, not an organization — hotline reports summarise tips
      about many bodies and name no single audited agency. Mapping them to the division would
      misread "who runs the hotline" as "who was audited".
  'Portland Public Schools':
    reason: A local school district, not a state agency. The registry is keyed on OAR chapter
      assignment and a district holds none — absent by construction, the same class as
      oregon-budget's Emergency Board.
