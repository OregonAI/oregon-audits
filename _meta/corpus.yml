# Corpus configuration — the single source of truth the toolkit reads.
corpus:
  id: "oregon-audits"
  name: "Oregon Audits — Secretary of State Audits Division"
  jurisdiction: "oregon"
  archetype: "document"
  # The division's own search page. Every MCP response carries a disclaimer telling an
  # agent this copy is non-authoritative and to verify at source; without this key it is
  # never told WHERE. Deliberately the search page rather than a report URL: individual
  # report PDFs move (2019's did — see AGENTS.md), the search page has not.
  authoritative_source: "https://sos.oregon.gov/audits/pages/state-audits.aspx"
  schema_version: 1
  contract_version: 1

# One root, one doc_type. Every document here is an audit or review report published by
# the Secretary of State Audits Division — the constitutional auditor of Oregon state
# government.
#
# SCOPE BOUNDARY, deliberately narrow. Municipal and local-government filings
# (sos.oregon.gov/audits/Pages/muniaudits.aspx) are OUT. They are a different publisher
# relationship and would dwarf the state-audit set. `jurisdiction` above stays a real
# field rather than a hardcoded constant so adding `oregon/marion-county` later is a data
# change, not a schema change.
content_roots:
  - path: "reports"
    doc_type: "audit_report"

plugins:
  # Vector search over the prebuilt embeddings artifact. The implementation is shared --
  # corpus_toolkit.semantic.search -- rather than a per-repo copy, because eight copies of a
  # loader do not stay identical and the details that drift are the expensive ones (the
  # convert-once matmul, the dim probe that fails a mismatched model closed).
  #
  # `_meta/embeddings/` is gitignored and mounted at runtime: it is derived from the
  # documents beside it, it needs a GPU to build, and it is far too large to commit. If the
  # mount is missing the server does NOT fail -- available() returns False and search_corpus
  # serves keyword-only, silently. That is the documented sharp edge, so the compose
  # healthcheck asserts availability rather than trusting a green container.
  semantic_search_module: "corpus_toolkit.semantic.search"
  citation_module: "src.citation_schemes"      # registers the `audit-report` scheme
  # No snapshot_slice_module: a report's snapshot is the whole PDF's extracted text, with
  # no per-document slicing out of a larger source file.
  # No issuing_body_registry: the publisher is the Audits Division for every document
  # here. The AUDITED agency is a frontmatter field, not an issuing body.
  extra_schema_checks: []
  # ^ audited_period_start/end become REQUIRED here once documents exist (see AGENTS.md,
  #   "A finding is not a fact"). Left empty until Stage 2 has something to check, because
  #   a check that runs against an empty corpus proves nothing and reads as if it does.

# Sibling corpora this one resolves citations INTO. Left commented DELIBERATELY: the
# toolkit resolves through schemes marked `register_scheme(..., corpus="<sibling id>")`,
# and none are marked yet. Declaring siblings before the schemes exist is inert config
# that reads as a working feature.
#
# These three are the whole reason this corpus is worth building, and they get wired in
# the graph stage:
siblings:
  # MEASURED before declaring, not assumed: 71% of the 242 reports cite ORS or OAR, giving
  # 576 edges to 193 distinct targets, of which 81% of targets and 85% of edges resolve to
  # real documents in this sibling's published index. The unresolved remainder is almost
  # entirely ERF coverage: 28 of 34 missing ORS sections are in chapters ERF does not carry
  # at all (163A, 181A, 238A), not citations this corpus got wrong.
  - id: "executive-regulatory-frameworks"
    index_url: "https://oregonai.github.io/executive-regulatory-frameworks/corpus-index.json"
    web_base:  "https://github.com/OregonAI/executive-regulatory-frameworks/blob/main/"
  # MEASURED before declaring, same as the sibling above. Of 393 federal citation occurrences
  # across the 242 reports, 181 (46.1%) resolve into federal-reference. Only 28 reports cite
  # a federal instrument at all, so this edge is NARROW AND DEEP -- but it is the one this
  # platform was missing. An audit finds the state out of compliance with 2 CFR 200.303, and
  # until now the requirement it was measured against resolved to nothing at all.
  #
  # WHAT THE SECTION SPLIT BOUGHT IS PRECISION, NOT COVERAGE, and the measurement says so
  # plainly: against a 5-document federal-reference the same 181 citations resolve, but all
  # 181 land on ONE document -- the whole 633,000-character part. Against the 34-document
  # version they reach 30 distinct documents, and the 58 citations of 2 CFR 200.303 land on
  # its 1,476 characters instead. Same rate, completely different answer.
  #
  # The unresolved 212 are almost entirely instruments federal-reference does not yet hold
  # (45 CFR 75, 2 CFR 170, 42 CFR 455), NOT citations this corpus got wrong. Each begins
  # resolving the day that instrument is ingested, with no change here.
  - id: "federal-reference"
    index_url: "https://oregonai.github.io/federal-reference/corpus-index.json"
    web_base:  "https://github.com/OregonAI/federal-reference/blob/main/"
# oregon-budget and oregon-legislature are NOT declared. Both were in the seed's plan, but
# no scheme mines an appropriation or measure citation out of audit text yet, so declaring
# them would add configuration that resolves nothing. Declare them with the scheme, not
# before it.

disclaimer_marker: "NON-AUTHORITATIVE"
graph_path: "_meta/graph.json"
source_manifest_path: "_meta/source-manifest.yml"
snapshot_dir: "_meta/snapshots"

provenance:
  coverage_fail_threshold: 0.70
  coverage_warn_threshold: 0.90

mcp:
  server_name: "oregon-audits"
  transports: [stdio, http]
  # Domain frontmatter this corpus promises to serve on get_document
  # (corpus-toolkit >= 1.11.0). Without this the toolkit returns a fixed key set and
  # these are parsed, ignored and dropped -- they would be REQUIRED by
  # src/check_guardrails.py and simultaneously unreachable by every caller.
  #
  # audited_period_* is the reason this exists. It is the field that stops a 2019 finding
  # being read as current, and until now the only way an agent could see it was by
  # parsing the English sentence ingest wrote into `## At a glance`. A question like
  # "which audits cover FY2021" should be a filter, not a reading comprehension exercise.
  extra_document_fields:
    - report_number
    - audit_type
    - audited_agency
    - report_date
    - audited_period_start
    - audited_period_end
    - audited_period_text
    - agency_response
    # The cross-corpus agency identity: audited_agency resolved to the ERF registry slug
    # via _meta/agency-crosswalk.yml (executive-regulatory-frameworks#83). Absent, not
    # null, on the three audited_agency values recorded as having no ERF counterpart —
    # absence is a decision with a stated reason in the crosswalk, never a blank.
    - agency_registry_slug
    - agency_registry_corpus

status:
  # WHAT RE-VERIFICATION MEANS HERE IS NOT WHAT IT MEANS ELSEWHERE.
  #
  # A statute gets amended and a rule gets repealed, so those corpora re-check for CONTENT
  # drift. An audit report is immutable once published — it is a dated historical record,
  # and a 2021 report will say in 2030 exactly what it says today. Re-verification here is
  # almost entirely about LINK ROT.
  #
  # That is not a theoretical risk. Reports published before 2020 are no longer served at
  # sos.oregon.gov/audits/Documents/<number>.pdf — 2019-01 and 2019-14 both 404 today,
  # while 2026-20 resolves fine from the same path. The upstream URL for a document that
  # will never change its text moved anyway. Snapshots are what make that survivable.
  #
  # 365, not the template's 90. This value drives STATUS.md's "overdue for re-verification"
  # count, and re-verification means a human re-reading a document against its source. For
  # an immutable record that is work with no possible finding: the text cannot have changed,
  # and the hash already proves the committed copy matches what was ingested. A quarterly
  # nag for 242 documents would be 242 pieces of busywork a year, and the reliable result of
  # a check that never finds anything is that people stop reading it.
  #
  # Matched to the annual source re-fetch in .github/workflows/scheduled.yml, so the two
  # cadences say the same thing.
  reverify_days: 365
