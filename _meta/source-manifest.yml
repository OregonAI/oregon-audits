note: "Every upstream source this corpus consumes. Human-approved via PR BEFORE any\ningestion. GENERATED\
  \ by src/enumerate_audits.py — do not hand-edit; re-run it.\n\nSource: the SharePoint list behind sos.oregon.gov/audits/pages/state-audits.aspx,\n\
  which renders nothing server-side. The list is captioned by the division itself as\n'State Audits and\
  \ Reviews 2020 to present', which is why this corpus floors at 2020.\n\nTraps recorded so a future re-enumeration\
  \ does not fall into them:\n1. The search page's HTML carries a fresh __VIEWSTATE per request, so its\
  \ bytes are\n   never stable. Compare the extracted RECORD SET, never the page.\n2. hrefs inside Additional_x0020_Documents\
  \ are entity-escaped (`https&#58;//`).\n   Unescape them or every URL 404s in a way that looks exactly\
  \ like link rot.\n3. Report numbers are NOT dense. A gap can be a withdrawal under GAGAS 3.34 — one\n\
  \   really is — so every gap is listed below with a reason rather than skipped.\n4. `format: html` is\
  \ deliberate and is NOT a mistake: these URLs serve an HTML\n   viewer with the PDF base64-encoded inside\
  \ a <script>. Declaring `pdf` would run\n   pdftotext over HTML.\n"
index: https://sos.oregon.gov/audits/pages/state-audits.aspx
list_api: https://sos.oregon.gov/audits/_api/web/lists/getbytitle('Audit%20Search')/items?$top=500
recheck: annual
coverage:
  floor: 2020 — the upstream list does not go earlier
  in_scope: numbered audit reports (Report No. YYYY-NN)
  out_of_scope: unnumbered per-agency financial attestation rows, and municipal/local-government filings
numbering_gaps:
- '2023-15: Report No. 2023-15 removed in accordance with GAGAS 3.34'
- '2023-16: not present in the Audit Search list'
- '2025-09: not present in the Audit Search list'
anomalies:
- '2024-27: appears on more than one list row (''The Oregon Eligibility System Appropriat'' / ''The Oregon
  Eligibility System Appropriat'')'
- '2024-28: appears on more than one list row (''Licensing and Registration System Accura'' / ''Licensing
  and Registration System Accura'')'
- '2020-43: appears on more than one list row (''By Appropriately Administering Measure 7'' / ''By Appropriately
  Administering Measure 7'')'
- '2020-21: appears on more than one list row (''Oregon Should Improve Child Safety by St'' / ''Oregon
  Should Improve Child Safety by St'')'
- '2020-21: appears on more than one list row (''Oregon Should Improve Child Safety by St'' / ''Oregon
  Should Improve Child Safety by St'')'
- '2020-05: appears on more than one list row ("Using the U.S. Treasury''s Do Not Pay Sys" / "Using the
  U.S. Treasury''s Do Not Pay Sys")'
